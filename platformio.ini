; PlatformIO Project Configuration File
; RC Car — ESP32 + DRV8833 + PS3 controller + MAX98357A audio
;
; espressif32 @ 6.9.0 ships Arduino-ESP32 core 2.0.17.
; Do NOT upgrade to core 3.x — the PS3 Controller Host library and the
; ledcSetup()/ledcAttachPin() API used here require core 2.x.

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Bluetooth stack + audio synthesis need more flash than the default app partition
board_build.partitions = huge_app.csv

lib_deps =
    jvpernis/PS3 Controller Host@^1.1.0
